name: Deploy GalaClinic

# Change this to your production branch once you set one up (e.g. `main`
# after switching to a PR-based flow) — right now this IS the only branch,
# so every push here deploys.
on:
  push:
    branches:
      - claude/dental-booking-service-aorx3i
  workflow_dispatch:
    inputs:
      demo_data:
        description: 'Demo dataset: leave alone, create it, or delete it'
        required: false
        default: 'none'
        type: choice
        options: [none, seed, purge]
      demo_telegram_id:
        description: 'Optional: bind the first demo patient to this Telegram id (send /whoami to the bot to get yours)'
        required: false
        default: ''
        type: string

env:
  DOMAIN: galactic.swipescape.eu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          # Blocks the deploy if Mini App signature verification regresses.
          npm test

      - name: Build telegram-bot
        working-directory: telegram-bot
        run: |
          npm ci
          npm run build

      - name: Build site (Next.js static export)
        working-directory: site
        env:
          # Every client-side request path already starts with /api/ (e.g.
          # request('/api/visit-types')) — this must be the bare origin, not
          # .../api, or every request 404s as /api/api/... in production.
          NEXT_PUBLIC_BACKEND_URL: https://${{ env.DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: Build admin-web
        working-directory: admin-web
        env:
          VITE_BACKEND_URL: https://${{ env.DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: Build telegram-app
        working-directory: telegram-app
        env:
          VITE_BACKEND_URL: https://${{ env.DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory exists
        timeout-minutes: 2
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/galactic-dent/backend /opt/galactic-dent/telegram-bot /opt/galactic-dent/site /opt/galactic-dent/admin-web /opt/galactic-dent/telegram-app /opt/galactic-dent/deploy"

      - name: Sync build output to server
        timeout-minutes: 5
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # --delete is scoped to dist/prisma/out subdirectories only — it
          # never touches backend/.env or telegram-bot/.env, which live one
          # level up and are never part of these source trees.
          rsync -az --delete -e "$SSH" backend/dist/ "$DEST:/opt/galactic-dent/backend/dist/"
          rsync -az --delete -e "$SSH" backend/prisma/ "$DEST:/opt/galactic-dent/backend/prisma/"
          rsync -az -e "$SSH" backend/package.json backend/package-lock.json "$DEST:/opt/galactic-dent/backend/"

          rsync -az --delete -e "$SSH" telegram-bot/dist/ "$DEST:/opt/galactic-dent/telegram-bot/dist/"
          rsync -az -e "$SSH" telegram-bot/package.json telegram-bot/package-lock.json "$DEST:/opt/galactic-dent/telegram-bot/"

          rsync -az --delete -e "$SSH" site/out/ "$DEST:/opt/galactic-dent/site/out/"
          rsync -az --delete -e "$SSH" admin-web/dist/ "$DEST:/opt/galactic-dent/admin-web/dist/"
          rsync -az --delete -e "$SSH" telegram-app/dist/ "$DEST:/opt/galactic-dent/telegram-app/dist/"

          rsync -az -e "$SSH" deploy/ "$DEST:/opt/galactic-dent/deploy/"

      - name: Run remote deploy script
        timeout-minutes: 10
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DOMAIN='${{ env.DOMAIN }}' \
             POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
             TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
             LETSENCRYPT_EMAIL='${{ secrets.LETSENCRYPT_EMAIL }}' \
             ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}' \
             ANTHROPIC_MODEL='${{ secrets.ANTHROPIC_MODEL }}' \
             STAFF_CHAT_ID='${{ secrets.STAFF_CHAT_ID }}' \
             ELEVENLABS_API_KEY='${{ secrets.ELEVENLABS_API_KEY }}' \
             ELEVENLABS_AGENT_ID='${{ secrets.ELEVENLABS_AGENT_ID }}' \
             bash /opt/galactic-dent/deploy/remote-deploy.sh"

      # Never runs on an ordinary push. Two deliberate triggers:
      #   * "Run workflow" with demo_data set to seed/purge
      #   * a commit message containing [demo-seed] or [demo-purge] — the same
      #     explicit opt-in, through the one channel available to an automation
      #     that can push but has no workflow_dispatch permission
      #
      # Both scripts are compiled into backend/dist by the build above, so they
      # run under the server's production-only dependencies without ts-node.
      - name: Decide whether to touch the demo dataset
        id: demo
        run: |
          ACTION=none
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.demo_data }}"
          else
            # Subject line only, never the body. Reading the whole message once
            # turned a commit that *described* both markers into a purge.
            SUBJECT=$(git log -1 --pretty=%s)
            case "$SUBJECT" in
              *"[demo-purge]"*) ACTION=purge ;;
              *"[demo-seed]"*)  ACTION=seed ;;
            esac
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Demo dataset action: $ACTION"

      - name: Seed or purge the demo dataset
        if: steps.demo.outputs.action != 'none'
        timeout-minutes: 5
        run: |
          SCRIPT=$([ "${{ steps.demo.outputs.action }}" = "seed" ] && echo seedDemo || echo purgeDemo)
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/galactic-dent/backend && set -a && . ./.env && set +a && \
             DEMO_TELEGRAM_ID='${{ inputs.demo_telegram_id }}' DEMO_SHOWCASE_LATEST=1 \
             node dist/scripts/${SCRIPT}.js"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # A 200 only proves nginx answered — it does not prove the rsync landed.
      # Assert on a string that only exists in the current build so a silently
      # stale deploy fails here instead of looking healthy.
      - name: External reachability + freshness check
        run: |
          HTML=$(curl -sS \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -w '\nHTTP_CODE:%{http_code}' "https://${{ env.DOMAIN }}/")
          CODE=${HTML##*HTTP_CODE:}
          echo "homepage -> $CODE"
          [ "$CODE" = "200" ] || { echo "Homepage is not serving 200."; exit 1; }
          # Report which integrations actually have credentials on the server.
          # A missing key is invisible from outside — the chat silently falls
          # back to canned replies and the call button just never renders — so
          # this is the only place it becomes obvious.
          echo "--- integrations ---"
          curl -sS "https://${{ env.DOMAIN }}/api/health"
          echo
          for NEEDLE in 'tel:+420352308111' 'Jak probíhá první návštěva' 'GalaClinic'; do
            case "$HTML" in
              *"$NEEDLE"*) echo "found: $NEEDLE" ;;
              *) echo "MISSING from the served page: $NEEDLE — the server is running an older build."; exit 1 ;;
            esac
          done
          # Assert the artwork landed too. The HTML above is only the markup —
          # a half-finished rsync can serve a renamed page next to the previous
          # logo, and nothing in the strings above would notice.
          for ASSET in /logo.png /logo-mark.png /icon.png; do
            ACODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://${{ env.DOMAIN }}${ASSET}")
            echo "$ASSET -> $ACODE"
            [ "$ACODE" = "200" ] || { echo "$ASSET is not being served."; exit 1; }
          done

      # End-to-end guard against the exact regression that broke the Mini App:
      # the payload is signed the way real Telegram signs it — `signature` is a
      # normal field inside the data-check-string, only `hash` is left out — and
      # POSTed to the live API. /session is read-only, so this creates nothing.
      # A non-200 here means production would reject every real Telegram user.
      # Runs only when the voice call is failing and we need to know why.
      # The three checks separate the causes that all look like one 502 from
      # the browser: a key that is invalid or lacks the convai scope, an agent
      # id that points at nothing, and an account that cannot start a call.
      # Prints status codes and a redacted reason — never the key, and never a
      # raw body, because this repository is public and so are these logs.
      - name: Diagnose ElevenLabs voice configuration
        if: always()
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ] || [ -z "$ELEVENLABS_AGENT_ID" ]; then
            echo "No ElevenLabs credentials configured — skipping."; exit 0
          fi

          probe() {
            LABEL="$1"; URL="$2"
            BODY=$(curl -sS -m 20 -w '\nHTTP_CODE:%{http_code}' -H "xi-api-key: $ELEVENLABS_API_KEY" "$URL" || echo "HTTP_CODE:000")
            CODE=${BODY##*HTTP_CODE:}
            # Keep only the machine-readable reason, drop everything else.
            REASON=$(printf '%s' "${BODY%HTTP_CODE:*}" \
              | tr -d '\n' \
              | grep -oE '"(status|message|detail)"[[:space:]]*:[[:space:]]*"[^"]{0,120}"' \
              | head -3 | tr '\n' ' ')
            echo "$LABEL -> HTTP $CODE  ${REASON:-（no reason field）}"
          }

          echo "1. Is the API key itself valid?"
          probe "   user/subscription " "https://api.elevenlabs.io/v1/user/subscription"
          echo "2. Does that agent id exist, and may this key see it?"
          probe "   convai/agents/ID  " "https://api.elevenlabs.io/v1/convai/agents/$ELEVENLABS_AGENT_ID"
          echo "3. The call our backend actually makes:"
          probe "   conversation/token" "https://api.elevenlabs.io/v1/convai/conversation/token?agent_id=$ELEVENLABS_AGENT_ID"

          # "Have the credits run out?" is the first thing anyone asks when a
          # call fails, and probe 1 could not answer it: the grep above keeps
          # only status/message/detail, and the balance lives in other fields.
          # Print it plainly. These are usage counters, not account secrets.
          echo "4. How much quota is left?"
          SUB=$(curl -sS -m 20 -H "xi-api-key: $ELEVENLABS_API_KEY" \
            "https://api.elevenlabs.io/v1/user/subscription" || echo '{}')
          echo "$SUB" | tr ',' '\n' \
            | grep -oE '"(tier|character_count|character_limit|status|next_character_count_reset_unix)"[^,}]*' \
            | sed 's/^/   /' || echo "   (could not read subscription)"

          # 5 is the only probe that reproduces what the visitor's browser does,
          # including our own rate limit — which returns 429 and looks, from the
          # website, exactly like ElevenLabs being down.
          echo "5. What the browser actually gets from our own endpoint:"
          VOICE=$(curl -sS -m 20 -w '\nHTTP_CODE:%{http_code}' "https://${{ env.DOMAIN }}/api/voice/session" || echo "HTTP_CODE:000")
          VCODE=${VOICE##*HTTP_CODE:}
          # Never print the body: on success it contains a live conversation token.
          echo "   /api/voice/session -> HTTP $VCODE"
          case "$VCODE" in
            200) echo "   -> the endpoint is working; a failing call is in the browser (mic permission, WebRTC)" ;;
            429) echo "   -> RATE LIMITED by our own throttle, not by ElevenLabs. Wait 10 minutes." ;;
            503) echo "   -> the server has no ELEVENLABS_* env vars; the button should be hidden" ;;
            502) echo "   -> ElevenLabs refused. Probes 3 and 4 above say why." ;;
          esac

          echo
          echo "Reading the result:"
          echo "  1 fails 401          -> the API key is wrong or revoked"
          echo "  1 ok, 2 fails 404    -> ELEVENLABS_AGENT_ID points at no agent"
          echo "  1 ok, 2 fails 401    -> the key lacks the ElevenAgents (convai) Write scope"
          echo "  1,2 ok, 3 fails      -> agent exists but cannot start a call (credits, or agent not published)"
          echo "  4 shows count==limit -> the quota really is spent; top up or wait for the reset"
          echo "  5 is 429             -> nothing is broken, the throttle just fired"

      - name: Verify Mini App session auth against production
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          import crypto from 'node:crypto';

          const botToken = process.env.TELEGRAM_BOT_TOKEN.trim();
          const user = { id: 999001, first_name: 'Jana', last_name: 'Testovací', language_code: 'cs' };
          const fields = {
            // Real query_id values are base64 and routinely contain '+', which
            // is the character that distinguishes RFC 3986 decoding from
            // form-urlencoded decoding. Keep one here so the check covers it.
            query_id: 'AAH+diag/nostic=',
            user: JSON.stringify(user),
            auth_date: String(Math.floor(Date.now() / 1000)),
            signature: crypto.randomBytes(64).toString('base64url'),
          };
          const dataCheckString = Object.keys(fields).sort().map((k) => `${k}=${fields[k]}`).join('\n');
          const secretKey = crypto.createHmac('sha256', 'WebAppData').update(botToken).digest();
          const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
          const initData = new URLSearchParams({ ...fields, hash }).toString();

          const res = await fetch('https://${{ env.DOMAIN }}/api/telegram-app/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData }),
          });
          const text = await res.text();
          console.log(`status: ${res.status}`);
          console.log(`body: ${text}`);
          if (res.status !== 200) {
            console.error('Mini App session auth is BROKEN in production — real Telegram users will see "Nepodařilo se ověřit relaci".');
            process.exit(1);
          }
          console.log('OK — production accepts a genuinely-shaped Telegram signature.');
          EOF
