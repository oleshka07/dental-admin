# Starting point only — after the first deploy, certbot's nginx plugin
# rewrites this file in place to add the HTTPS server block + redirect.
# remote-deploy.sh only WRITES this file if it doesn't exist yet, so it
# never clobbers certbot's changes on later deploys. To change routing
# rules after that point, edit this file directly on the server (or remove
# it and let a redeploy recreate it, then re-run certbot).

server {
    listen 80;
    listen [::]:80;
    server_name galactic.swipescape.eu;

    client_max_body_size 5m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias /opt/galactic-dent/admin-web/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /app/ {
        alias /opt/galactic-dent/telegram-app/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    root /opt/galactic-dent/site/out;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
